name: Setup Codependence toolchain
description: Install pinned Node.js and Nub, then optionally install dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: ""
  cache:
    description: Restore the Nub package cache.
    required: false
    default: "false"
  install:
    description: Install project dependencies after setting up the runtime.
    required: false
    default: "true"
  frozen-lockfile:
    description: Use nub install --frozen-lockfile when installing dependencies.
    required: false
    default: "true"
  registry-url:
    description: Optional npm registry URL for setup-nub.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve tool versions
      id: tool-versions
      shell: bash
      run: node scripts/ci/tool-versions.js github-output
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}

    - name: Setup Node.js and Nub
      if: inputs.registry-url == ''
      uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
      with:
        node-version: ${{ steps.tool-versions.outputs.node_version }}
        nub-version: ${{ steps.tool-versions.outputs.nub_version }}
        cache: ${{ inputs.cache }}

    - name: Setup Node.js and Nub with npm registry
      if: inputs.registry-url != ''
      uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
      with:
        node-version: ${{ steps.tool-versions.outputs.node_version }}
        nub-version: ${{ steps.tool-versions.outputs.nub_version }}
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: inputs.install == 'true' && inputs.frozen-lockfile == 'true'
      shell: bash
      run: nub install --frozen-lockfile

    - name: Install dependencies
      if: inputs.install == 'true' && inputs.frozen-lockfile != 'true'
      shell: bash
      run: nub install
