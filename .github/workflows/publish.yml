name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    environment: npm-publish
    env:
      FORMULA_PATH: codependence.rb
      TAP_NAME: codependence/release-preflight
    permissions:
      artifact-metadata: write
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_REF#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"

      - run: nub run validate
        env:
          CI: true

      - run: nub run build-dist

      - run: node dist/cli.js --help

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Homebrew tap token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for stable releases"
            exit 1
          fi

          CAN_PUSH="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN must have write access to yowainwright/homebrew-tap"
            exit 1
          fi

      - name: Pack npm tarball
        id: pack
        run: |
          npm pack --ignore-scripts --json > npm-pack.json
          TARBALL="$(node -e "const fs = require('node:fs'); const text = fs.readFileSync('npm-pack.json', 'utf8'); const start = text.indexOf('['); if (start < 0) throw new Error('npm pack JSON output not found'); const [pkg] = JSON.parse(text.slice(start)); console.log(pkg.filename)")"
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Generate formula from packed tarball
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          VERSION="${GITHUB_REF_NAME#v}" nub scripts/release/index.ts brew generate-local

      - name: Audit formula before publishing
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          brew tap-new --no-git "$TAP_NAME"
          TAP_PATH="$(brew --repository "$TAP_NAME")"
          cp "$FORMULA_PATH" "$TAP_PATH/Formula/codependence.rb"
          brew audit --strict --formula "$TAP_NAME/codependence"

      - name: Attest npm tarball
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Prepare release attestation
        id: release-attestation
        run: |
          SIGSTORE_BUNDLE="${{ steps.pack.outputs.tarball }}.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "$SIGSTORE_BUNDLE"
          echo "sigstore_bundle=$SIGSTORE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Publish npm package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          if npm view "codependence@$VERSION" version > /dev/null 2>&1; then
            echo "codependence@$VERSION is already published"
            exit 0
          fi

          npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGSTORE_BUNDLE: ${{ steps.release-attestation.outputs.sigstore_bundle }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_ARGS=()
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--draft)
          fi

          if gh release view "$VERSION" > /dev/null 2>&1; then
            nub scripts/release/index.ts assets "$VERSION" "$TARBALL" "$SIGSTORE_BUNDLE"
            exit 0
          fi

          gh release create "$VERSION" "$TARBALL" "$SIGSTORE_BUNDLE" \
            --title "$VERSION" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: "./.github/workflows/homebrew.yml"
    with:
      version: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
