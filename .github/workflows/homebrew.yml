name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-codependence
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FORMULA_PATH: codependence.rb
      RELEASE_REF: "${{ inputs.version }}"
      TAP_NAME: codependence/release-test

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "refs/tags/${{ inputs.version }}"

      - name: Verify release tag
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(jq -r '.version // empty' package.json)"
          test "${RELEASE_REF#v}" = "$PACKAGE_VERSION"
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          test "$(gh release view "$RELEASE_REF" --json tagName --jq .tagName)" = "$RELEASE_REF"
          echo "VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Validate Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for Homebrew publishing"
            exit 1
          fi

          CAN_PUSH="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN must have write access to yowainwright/homebrew-tap"
            exit 1
          fi

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: release-tools
          persist-credentials: false
          ref: "${{ github.workflow_sha }}"
          sparse-checkout: |
            scripts/upload-release-assets.sh
            scripts/release/index.ts
            scripts/release/constants.ts
            scripts/release/types.ts
            scripts/release/utils.ts
            src/dx/constants.ts
            src/dx/output/*
            src/dx/report/constants.ts
            src/observability/*
          sparse-checkout-cone-mode: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate stable version
        run: |
          nub release-tools/scripts/release/index.ts brew validate-version

      - name: Check Homebrew release state
        id: homebrew-state
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
        run: |
          nub release-tools/scripts/release/index.ts brew check-state

      - name: Wait for npm package availability
        if: steps.homebrew-state.outputs.skip != 'true'
        run: |
          export CODEPENDENCE_VERSION="$VERSION"
          node scripts/ci/published-release.js wait-for-npm

      - name: Build and test binary
        if: steps.homebrew-state.outputs.skip != 'true'
        id: binary
        run: |
          nub run test:e2e:binary

          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x64 ;;
            *) exit 1 ;;
          esac

          BINARY="codependence-darwin-${ARCH}"
          cp artifacts/codependence "$BINARY"
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Attest binary
        if: steps.homebrew-state.outputs.skip != 'true'
        id: binary-attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ steps.binary.outputs.binary }}

      - name: Prepare binary attestation
        if: steps.homebrew-state.outputs.skip != 'true'
        id: binary-attestation
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
          BUNDLE_PATH: ${{ steps.binary-attest.outputs.bundle-path }}
        run: |
          SIGSTORE_BUNDLE="${BINARY}.sigstore.json"
          cp "$BUNDLE_PATH" "$SIGSTORE_BUNDLE"
          echo "sigstore_bundle=$SIGSTORE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Generate formula from published tarball
        if: steps.homebrew-state.outputs.skip != 'true'
        run: nub release-tools/scripts/release/index.ts brew generate

      - name: Create formula test tap
        if: steps.homebrew-state.outputs.skip != 'true'
        run: |
          brew tap-new --no-git "$TAP_NAME"
          TAP_PATH="$(brew --repository "$TAP_NAME")"
          cp "$FORMULA_PATH" "$TAP_PATH/Formula/codependence.rb"

      - name: Install and test formula
        if: steps.homebrew-state.outputs.skip != 'true'
        run: |
          brew audit --new --formula "$TAP_NAME/codependence"
          brew audit --strict --online "$TAP_NAME/codependence"
          brew install --build-from-source "$TAP_NAME/codependence"
          brew test "$TAP_NAME/codependence"
          codependence --help
          cdp --help

      - name: Update Homebrew tap
        if: steps.homebrew-state.outputs.skip != 'true'
        env:
          TAP_BRANCH: codependence-release
          TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
        run: |
          nub release-tools/scripts/release/index.ts brew update-tap

      - name: Attach Homebrew assets to GitHub release
        if: steps.homebrew-state.outputs.skip != 'true'
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
          GITHUB_TOKEN: "${{ github.token }}"
          SIGSTORE_BUNDLE: ${{ steps.binary-attestation.outputs.sigstore_bundle }}
        run: |
          RELEASE_SCRIPT="release-tools/scripts/upload-release-assets.sh"
          RELEASE_TAG="v${VERSION}"
          RELEASE_ASSETS=("$FORMULA_PATH" "$BINARY" "$SIGSTORE_BUNDLE")
          RELEASE_ID="$(sh "$RELEASE_SCRIPT" "$RELEASE_TAG" "${RELEASE_ASSETS[@]}")"
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: steps.homebrew-state.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api --method PATCH "$RELEASE_ENDPOINT" -F draft=false --silent
