name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-codependence
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: macos-latest
    environment: homebrew-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FORMULA_PATH: codependence.rb
      RELEASE_REF: "${{ inputs.version }}"
      TAP_NAME: codependence/release-test

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ inputs.version }}"

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: release-tools
          persist-credentials: false
          ref: "${{ github.workflow_sha }}"
          sparse-checkout: scripts/upload-release-assets.sh
          sparse-checkout-cone-mode: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate stable version
        run: |
          export VERSION="${RELEASE_REF#v}"
          PACKAGE_VERSION="$(bun -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bun scripts/brew.ts validate-version

      - name: Wait for npm package availability
        run: |
          export CODEPENDENCE_VERSION="$VERSION"
          node scripts/ci/published-release.js wait-for-npm

      - name: Build and test binary
        id: binary
        run: |
          bun run test:e2e:binary

          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x64 ;;
            *) exit 1 ;;
          esac

          BINARY="codependence-darwin-${ARCH}"
          cp artifacts/codependence "$BINARY"
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Attest binary
        id: binary-attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ steps.binary.outputs.binary }}

      - name: Prepare binary attestation
        id: binary-attestation
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
          BUNDLE_PATH: ${{ steps.binary-attest.outputs.bundle-path }}
        run: |
          SIGSTORE_BUNDLE="${BINARY}.sigstore.json"
          cp "$BUNDLE_PATH" "$SIGSTORE_BUNDLE"
          echo "sigstore_bundle=$SIGSTORE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Generate formula from published tarball
        run: bun scripts/brew.ts generate

      - name: Create formula test tap
        run: |
          brew tap-new --no-git "$TAP_NAME"
          TAP_PATH="$(brew --repository "$TAP_NAME")"
          cp "$FORMULA_PATH" "$TAP_PATH/Formula/codependence.rb"

      - name: Install and test formula
        run: |
          brew audit --new --formula "$TAP_NAME/codependence"
          brew audit --strict --online "$TAP_NAME/codependence"
          brew install --build-from-source "$TAP_NAME/codependence"
          brew test "$TAP_NAME/codependence"
          codependence --help
          cdp --help

      - name: Attach formula to GitHub release
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
          GITHUB_TOKEN: "${{ github.token }}"
          SIGSTORE_BUNDLE: ${{ steps.binary-attestation.outputs.sigstore_bundle }}
        run: |
          RELEASE_SCRIPT="release-tools/scripts/upload-release-assets.sh"
          RELEASE_TAG="v${VERSION}"
          RELEASE_ASSETS=("$FORMULA_PATH" "$BINARY" "$SIGSTORE_BUNDLE")
          RELEASE_ID="$(sh "$RELEASE_SCRIPT" "$RELEASE_TAG" "${RELEASE_ASSETS[@]}")"
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Update Homebrew tap
        env:
          GH_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
          TAP_BRANCH: "codependence-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          gh repo clone yowainwright/homebrew-tap tap
          if cmp -s "$FORMULA_PATH" tap/Formula/codependence.rb; then
            exit 0
          fi
          cd tap
          git switch -c "$TAP_BRANCH"
          cp "../$FORMULA_PATH" Formula/codependence.rb
          git add Formula/codependence.rb
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "codependence $VERSION"
          git push --set-upstream origin "$TAP_BRANCH"
          gh pr create --base main --head "$TAP_BRANCH" --title "codependence $VERSION" --body "Automated formula update for codependence $VERSION."

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api --method PATCH "$RELEASE_ENDPOINT" -F draft=false --silent
