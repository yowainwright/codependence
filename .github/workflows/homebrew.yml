name: Publish Homebrew binaries

on:
  workflow_call:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codependence-binary-release
  cancel-in-progress: false

jobs:
  preflight:
    uses: yowainwright/homebrew-tap/.github/workflows/publish-formula.yml@c175e0ca1e20631c6d04ee2d690c6d6b626c5dee
    with:
      package: codependence
      tag: "${{ inputs.version }}"
      preflight_only: true
    secrets:
      tap_token: "${{ secrets.HOMEBREW_TAP_TOKEN }}"

  binary:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: ubuntu-22.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_REF: "${{ inputs.version }}"
      BINARY: codependence-${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "refs/tags/${{ inputs.version }}"

      - name: Verify release tag
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          [[ "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          PACKAGE_VERSION="$(jq -r '.version // empty' package.json)"
          test "${RELEASE_REF#v}" = "$PACKAGE_VERSION"
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          test "$(gh release view "$RELEASE_REF" --json tagName --jq .tagName)" = "$RELEASE_REF"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build and test binary
        run: nub run test:e2e:binary

      - name: Verify standalone binary
        shell: bash
        run: |
          cp artifacts/codependence "$BINARY"
          test "$(env -i PATH=/nonexistent "$PWD/$BINARY" --version)" = "${RELEASE_REF#v}"
          env -i PATH=/nonexistent "$PWD/$BINARY" --help

          case "$RUNNER_OS" in
            macOS)
              otool -L "$BINARY" > linked-libraries.txt
              cat linked-libraries.txt
              awk 'NR > 1 && $1 !~ /^\/usr\/lib\// && $1 !~ /^\/System\/Library\// { bad = 1 } END { exit bad }' linked-libraries.txt
              ;;
            Linux)
              readelf -d "$BINARY" > linked-libraries.txt
              cat linked-libraries.txt
              awk '/NEEDED/ && $NF !~ /^\[lib(c|m|pthread|dl|rt|resolv)\.so(\.[0-9]+)*\]$/ && $NF !~ /^\[ld-linux[^]]*\]$/ { bad = 1 } END { exit bad }' linked-libraries.txt
              ;;
            *) exit 1 ;;
          esac

      - name: Attest binary
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ env.BINARY }}

      - name: Attach Homebrew assets to GitHub release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          cp "$BUNDLE_PATH" "${BINARY}.sigstore.json"
          nub scripts/release/index.ts assets "$RELEASE_REF" "$BINARY" "${BINARY}.sigstore.json"

  release:
    needs: binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      GH_REPO: "${{ github.repository }}"
      RELEASE_REF: "${{ inputs.version }}"
    steps:
      - name: Verify complete binary matrix
        run: |
          gh release view "$RELEASE_REF" --json assets --jq '.assets[].name' > assets.txt
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            grep -Fx "codependence-$target" assets.txt
            grep -Fx "codependence-$target.sigstore.json" assets.txt
          done

      - name: Publish GitHub release
        run: gh release edit "$RELEASE_REF" --draft=false

  homebrew:
    needs: release
    uses: yowainwright/homebrew-tap/.github/workflows/publish-formula.yml@c175e0ca1e20631c6d04ee2d690c6d6b626c5dee
    with:
      package: codependence
      tag: "${{ inputs.version }}"
    secrets:
      tap_token: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
