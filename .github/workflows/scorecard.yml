name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Exclude intentional test fixtures
        run: |
          jq '
            .runs[].results |= map(
              select(
                .ruleId != "PinnedDependenciesID" or
                (.locations[0].physicalLocation.artifactLocation.uri // "" | startswith("tests/") | not)
              )
            )
          ' scorecard.sarif > filtered.sarif

      - name: Upload filtered Scorecard SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: filtered.sarif
