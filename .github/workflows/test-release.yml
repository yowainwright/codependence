name: Test Published Release
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Published codependence version to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Published codependence version to test (leave empty for latest on npm)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  published-release-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine Version to Test
        id: version
        run: nub scripts/release/index.ts test-published resolve-version
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}

      - name: Wait for NPM Package Availability
        run: nub scripts/release/index.ts test-published wait-for-npm
        env:
          CODEPENDENCE_VERSION: ${{ steps.version.outputs.version }}

      - name: Build Test Docker Image
        run: nub scripts/release/index.ts test-published build-release-image
        env:
          CODEPENDENCE_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify Installation
        run: nub scripts/release/index.ts test-published verify-installation

      - name: Run Full E2E Test Suite
        run: nub scripts/release/index.ts test-published run-e2e

      - name: Run NPM Package Smoke Test
        run: nub scripts/release/index.ts test-published run-npm-smoke
        env:
          CODEPENDENCE_VERSION: ${{ steps.version.outputs.version }}

      - name: Performance and Compatibility Check
        run: nub scripts/release/index.ts test-published compatibility-check

      - name: Report Test Results
        run: nub scripts/release/index.ts test-published summary
        env:
          CODEPENDENCE_VERSION: ${{ steps.version.outputs.version }}

      - name: Create Test Report
        if: success()
        run: nub scripts/release/index.ts test-published write-report
        env:
          CODEPENDENCE_VERSION: ${{ steps.version.outputs.version }}
