services:
  # Automated test runner
  test:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: test
      args:
        NODE_SLIM_IMAGE: ${NODE_SLIM_IMAGE}
    volumes:
      - test-results:/test/results
    environment:
      - NODE_ENV=test

  # Interactive development environment
  dev:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: test
      args:
        NODE_SLIM_IMAGE: ${NODE_SLIM_IMAGE}
    environment:
      - NODE_ENV=development
    entrypoint: ["bash", "/test/test-scenarios.sh", "dev"]
    stdin_open: true
    tty: true
    command: ["init"]

  # Builder for development
  builder:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: builder
      args:
        NODE_SLIM_IMAGE: ${NODE_SLIM_IMAGE}
    volumes:
      - ../..:/app
      - /app/node_modules
    working_dir: /app
    command: nub run build
    environment:
      - NODE_ENV=development

volumes:
  test-results:
